<form (ngSubmit)="onSubmit(titleName.value,ticketText.value)">
    <app-control  label="Title">
        <input name="title" id="title" #titleName />
    </app-control>
    <app-control  label="Request">
        <textarea name="request" id="request" rows="3" #ticketText></textarea>
    </app-control>
    <p>
        <button appButton>
            Submit <span ngProjectAs="icon">⌲</span>
        </button>
    </p>
</form>
