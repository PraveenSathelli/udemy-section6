<div>
    <ul>
        @for(ticket of tickets; track ticket.id)
        {
            <li>
                <app-ticket [data]="ticket" (close)="onCloseTicket(ticket.id)"/> - {{$first}} - {{$last}} - {{$even}}
            </li>
        } @empty {
            <p>no tickets</p>
        }
    </ul>
</div>
<app-new-tickets (add)="onAdd($event)" ></app-new-tickets>
